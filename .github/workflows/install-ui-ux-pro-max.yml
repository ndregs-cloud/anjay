name: Install UI UX Pro Max OpenCode Skill
on:
  push:
    paths:
      - ".github/workflows/install-ui-ux-pro-max.yml"
permissions:
  contents: write
jobs:
  install-skill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run official installer
        run:   px --yes ui-ux-pro-max-cli@latest init --ai opencode
      - name: Commit generated skill
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .opencode
          if git diff --cached --quiet; then
            echo "Skill files unchanged; no commit needed."
            exit 0
          fi
          git commit -m "Add UI UX Pro Max skill for OpenCode"
          git push origin HEAD:main
